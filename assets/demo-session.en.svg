<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="452" viewBox="0 0 1100 452" role="img" aria-label="aiw session example: the main session gets a dispatch hint, writes a task, dispatches it with aiw, verifies and commits">
  <style>
    text { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 14.5px; fill: #d4d4d8; }
    .dim { fill: #8b8b96; }
    .you { fill: #f4f4f5; }
    .hint { fill: #e5c07b; }
    .bullet { fill: #d97757; }
    .tool { fill: #7dd3fc; }
    .ok { fill: #86efac; }
    .title { font-size: 13px; fill: #9a9aa5; }
    .who { font-size: 11.5px; fill: #8b8b96; }
    .note { font-size: 15px; font-weight: 700; fill: #d97757; }
    .note2 { font-size: 14px; fill: #d97757; }
    .tag { font-size: 12px; fill: #1c1c22; font-weight: 600; }
  </style>
  <g>
  <rect width="880" height="452" rx="12" fill="#1c1c22"/>
  <rect width="880" height="38" rx="12" fill="#26262e"/>
  <rect y="26" width="880" height="12" fill="#26262e"/>
  <circle cx="22" cy="19" r="6" fill="#ff5f57"/><circle cx="42" cy="19" r="6" fill="#febc2e"/><circle cx="62" cy="19" r="6" fill="#28c840"/>
  <text x="440" y="24" text-anchor="middle" class="title">Claude Code · aiw</text>

  <rect x="16" y="58" width="848" height="30" rx="6" fill="#2b2b35"/>
  <text x="28" y="78" class="you">&gt; Add an uninstall script that undoes every install change, plus tests</text>
  <text x="44" y="104" class="dim">⎿</text><text x="66" y="104" class="hint">[dispatch] Bulk change: if one line states the check, hand it to aiw write …</text>

  <text x="28" y="146" class="bullet">●</text><text x="48" y="146">Read install.sh to see what it changes, then write a task:</text>
  <text x="48" y="168" class="dim">scope uninstall.sh + tests · idempotent · --dry-run · check: full test suite passes</text>

  <text x="28" y="208" class="bullet">●</text><text x="48" y="208"><tspan font-weight="700" fill="#f4f4f5">Bash</tspan><tspan class="tool">(aiw write . 1200 task.md --verify …)</tspan></text>
  <text x="44" y="232" class="dim">⎿</text><text x="66" y="232" class="dim">runs in the background · reading, editing, testing happen elsewhere</text>
  <text x="44" y="256" class="dim">⎿</text><text x="66" y="256" class="ok">✓ check 1/1 passed</text><text x="236" y="256" class="dim">· actual seat codex · 9 files changed</text>

  <text x="28" y="298" class="bullet">●</text><text x="48" y="298">Review the diff: a stray .bak symlink is left; fix it, update tests.</text>
  <text x="48" y="320">Tests pass; committed.</text>


  <line x1="28" y1="352" x2="852" y2="352" stroke="#33333d"/>
  <rect x="28" y="372" width="84" height="22" rx="11" fill="#e5c07b"/><text x="70" y="387" text-anchor="middle" class="tag">Auto hint</text>
  <text x="122" y="388" class="dim">hook suggests a seat</text>
  <rect x="316" y="372" width="104" height="22" rx="11" fill="#7dd3fc"/><text x="368" y="387" text-anchor="middle" class="tag">Main decides</text>
  <text x="430" y="388" class="dim">and verifies</text>
  <rect x="560" y="372" width="104" height="22" rx="11" fill="#86efac"/><text x="612" y="387" text-anchor="middle" class="tag">Results only</text>
  <text x="674" y="388" class="dim">no process in context</text>
  <text x="28" y="428" class="dim" style="font-size:12px">Condensed from a real session (adding aiw's uninstall script); real hints are in Chinese.</text>
</g>
  <g class="ann">
    <path d="M 924 74 L 892 74" stroke="#d97757" stroke-width="2.5" fill="none"/>
    <path d="M 900 67 L 888 74 L 900 81" stroke="#d97757" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
    <text y="72" class="note"><tspan x="930" dy="0">Only this line</tspan><tspan x="930" dy="20">is typed by you</tspan></text>
    <path d="M 892 96 h10 v234 h-10 M 902 213 h8" stroke="#d97757" stroke-width="2" fill="none"/>
    <text y="166" class="note2"><tspan x="922" dy="0" font-weight="700" font-size="15">All automatic</tspan><tspan x="922" dy="28">hook hint,</tspan><tspan x="922" dy="20">dispatch, checks,</tspan><tspan x="922" dy="20">commit</tspan><tspan x="922" dy="28">no commands to type</tspan></text>
  </g>
</svg>
