name: 问题报告 / Bug report
description: 报告可复现的问题，请勿附凭据 / Report a reproducible bug; never include credentials.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        请删除 token、密钥、账户、私人路径和任务内容。安全漏洞请按 SECURITY.md 私密报告。
        Remove tokens, keys, accounts, private paths and task content. Report vulnerabilities privately via SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: 实际与预期行为 / Actual and expected behavior
      description: 发生了什么？应怎样？ / What happened, and what should happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 最小命令、退出码与脱敏输出 / Minimal commands, exit code and sanitized output.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境 / Environment
      description: 系统、Python 与相关 CLI 版本 / OS, Python and relevant CLI versions.
    validations:
      required: true
  - type: textarea
    id: fingerprint
    attributes:
      label: 配置指纹 / Configuration fingerprint
      description: 附 aiw doctor --fingerprint 输出；不要贴凭据或完整私人配置 / Attach aiw doctor --fingerprint output; no credentials or full private configuration.
      render: text
    validations:
      required: true
